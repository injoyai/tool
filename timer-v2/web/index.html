<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定时任务</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="container">
    <header>
        <h1><span class="icon">&#9201;</span> 定时任务</h1>
        <div class="subtitle">// Cron-based task scheduler &middot; Go script runtime</div>
    </header>

    <div class="toolbar">
        <button id="openAddModal" class="btn-primary">+ 添加任务</button>
        <button id="refreshAll" class="btn-secondary">&#x21bb; 刷新</button>
        <button id="openLogModal" class="btn-secondary" style="margin-left:auto">执行日志</button>
    </div>

    <div class="table-wrapper">
        <table id="timerTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>类型</th>
                <th>Cron表达式</th>
                <th>执行内容</th>
                <th>状态</th>
                <th>下次执行</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="timerTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>添加定时任务</h2>
        <div class="form-group">
            <label for="addName">名称</label>
            <input type="text" id="addName" placeholder="请输入任务名称">
        </div>
        <div class="form-group">
            <label for="addType">类型</label>
            <select id="addType" class="type-select">
                <option value="script">Go 脚本</option>
                <option value="http">HTTP 请求</option>
                <option value="shell">Shell 命令</option>
                <option value="webhook">Webhook</option>
            </select>
        </div>
        <div class="form-group">
            <label for="addCronExpression">Cron表达式</label>
            <input type="text" id="addCronExpression" placeholder="请输入Cron表达式">
        </div>
        <div class="form-group content-script" id="addContentScript">
            <label for="addEditor">执行内容 (Go)</label>
            <div id="addEditor" class="editor-container"></div>
        </div>
        <div class="form-group content-http" id="addContentHttp">
            <label for="addHttpMethod">HTTP 请求</label>
            <div class="http-form">
                <select id="addHttpMethod">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <input type="text" id="addHttpUrl" placeholder="请输入请求URL">
                <textarea id="addHttpHeaders" placeholder='请求头 (JSON格式, 如 {"Content-Type":"application/json"})' rows="3"></textarea>
                <textarea id="addHttpBody" placeholder="请求体 (Body)" rows="5"></textarea>
            </div>
        </div>
        <div class="form-group content-shell" id="addContentShell">
            <label for="addShellCommand">Shell 命令</label>
            <textarea id="addShellCommand" class="shell-input" placeholder="请输入Shell命令" rows="8"></textarea>
        </div>
        <div class="form-group content-webhook" id="addContentWebhook">
            <label for="addWebhookUrl">Webhook</label>
            <div class="webhook-form">
                <input type="text" id="addWebhookUrl" placeholder="请输入Webhook URL">
                <textarea id="addWebhookPayload" placeholder="请求载荷 (Payload)" rows="6"></textarea>
            </div>
        </div>
        <button id="testAddScript" class="btn-secondary" style="margin-top: 16px; width: 100%;">测试执行</button>
        <div id="addTestResult" class="test-result" style="display:none;"></div>
        <button id="addTimer" class="btn-submit">添加任务</button>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>修改定时任务</h2>
        <div class="form-group">
            <label for="editName">名称</label>
            <input type="text" id="editName" placeholder="请输入任务名称">
        </div>
        <div class="form-group">
            <label for="editType">类型</label>
            <select id="editType" class="type-select">
                <option value="script">Go 脚本</option>
                <option value="http">HTTP 请求</option>
                <option value="shell">Shell 命令</option>
                <option value="webhook">Webhook</option>
            </select>
        </div>
        <div class="form-group">
            <label for="editCronExpression">Cron表达式</label>
            <input type="text" id="editCronExpression" placeholder="请输入Cron表达式">
        </div>
        <div class="form-group content-script" id="editContentScript">
            <label for="editEditor">执行内容 (Go)</label>
            <div id="editEditor" class="editor-container"></div>
        </div>
        <div class="form-group content-http" id="editContentHttp">
            <label for="editHttpMethod">HTTP 请求</label>
            <div class="http-form">
                <select id="editHttpMethod">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <input type="text" id="editHttpUrl" placeholder="请输入请求URL">
                <textarea id="editHttpHeaders" placeholder='请求头 (JSON格式, 如 {"Content-Type":"application/json"})' rows="3"></textarea>
                <textarea id="editHttpBody" placeholder="请求体 (Body)" rows="5"></textarea>
            </div>
        </div>
        <div class="form-group content-shell" id="editContentShell">
            <label for="editShellCommand">Shell 命令</label>
            <textarea id="editShellCommand" class="shell-input" placeholder="请输入Shell命令" rows="8"></textarea>
        </div>
        <div class="form-group content-webhook" id="editContentWebhook">
            <label for="editWebhookUrl">Webhook</label>
            <div class="webhook-form">
                <input type="text" id="editWebhookUrl" placeholder="请输入Webhook URL">
                <textarea id="editWebhookPayload" placeholder="请求载荷 (Payload)" rows="6"></textarea>
            </div>
        </div>
        <button id="testEditScript" class="btn-secondary" style="margin-top: 16px; width: 100%;">测试执行</button>
        <div id="editTestResult" class="test-result" style="display:none;"></div>
        <button id="saveChanges" class="btn-submit">保存修改</button>
    </div>
</div>

<!-- Log Modal -->
<div id="logModal" class="modal">
    <div class="modal-content" style="max-width: 900px;">
        <span class="close">&times;</span>
        <h2>执行日志</h2>
        <div style="display: flex; gap: 12px; margin-bottom: 16px; align-items: center;">
            <select id="logFilter" class="type-select" style="width: auto;">
                <option value="0">全部任务</option>
            </select>
            <button id="refreshLogs" class="btn-secondary" style="width: auto; padding: 8px 16px;">刷新</button>
            <button id="clearLogs" class="btn-secondary" style="width: auto; padding: 8px 16px; margin-left: auto;">清除日志</button>
        </div>
        <div class="table-wrapper" style="max-height: 500px; overflow-y: auto;">
            <table id="logTable">
                <thead>
                <tr>
                    <th>时间</th>
                    <th>任务名称</th>
                    <th>类型</th>
                    <th>状态</th>
                    <th>结果/错误</th>
                </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://testingcf.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/editor.js"></script>
<script src="/static/js/ws.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
