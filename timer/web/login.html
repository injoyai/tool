<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 定时任务</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --border-color: #2a2a4a;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-amber: #f59e0b;
            --accent-amber-hover: #d97706;
            --accent-amber-glow: rgba(245, 158, 11, 0.15);
            --danger: #ef4444;
            --radius-sm: 6px;
            --radius-lg: 14px;
            --transition: 0.2s ease;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 15% 20%, rgba(245, 158, 11, 0.04) 0%, transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(20, 184, 166, 0.03) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        .login-card {
            position: relative;
            z-index: 1;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .login-card h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-card h1 .icon { color: var(--accent-amber); font-size: 1.3rem; }
        .login-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
        }
        .login-card label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .login-card input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: all var(--transition);
        }
        .login-card input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-amber);
            background-color: var(--bg-tertiary);
            box-shadow: 0 0 0 3px var(--accent-amber-glow);
        }
        .login-card input:-webkit-autofill,
        .login-card input:-webkit-autofill:hover,
        .login-card input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text-primary);
            -webkit-box-shadow: 0 0 0 1000px var(--bg-primary) inset;
            transition: background-color 5000s ease-in-out 0s;
        }
        .login-card button {
            width: 100%;
            margin-top: 20px;
            padding: 11px 20px;
            background-color: var(--accent-amber);
            color: #0f0f1a;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Outfit', sans-serif;
        }
        .login-card button:hover {
            background-color: var(--accent-amber-hover);
            box-shadow: 0 0 20px var(--accent-amber-glow);
            transform: translateY(-1px);
        }
        .login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .err-msg {
            color: var(--danger);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 14px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h1><span class="icon">&#9201;</span> 定时任务</h1>
    <div class="subtitle">// 请输入访问密码</div>
    <form id="loginForm">
        <label for="password">密码</label>
        <input type="password" id="password" autocomplete="current-password" autofocus>
        <button type="submit" id="loginBtn">登录</button>
        <div class="err-msg" id="errMsg"></div>
    </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var pwd = document.getElementById('password').value;
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('errMsg');
    btn.disabled = true;
    btn.textContent = '登录中...';
    err.textContent = '';
    try {
        var res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
        });
        var data = await res.json();
        if (data.code === 200) {
            location.href = '/';
        } else {
            err.textContent = data.msg || '登录失败';
        }
    } catch (ex) {
        err.textContent = '网络错误，请重试';
    } finally {
        btn.disabled = false;
        btn.textContent = '登录';
    }
});
</script>
</body>
</html>
